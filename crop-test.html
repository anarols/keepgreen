<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body{font-family:sans-serif;background:#eee;padding:20px;margin:0}
.row{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.c{width:380px;border:1px solid #ccc;border-radius:12px;overflow:hidden;background:#fff}
.c .lab{font-size:12px;padding:6px 10px;background:#222;color:#fff}
.ph{aspect-ratio:16/8;overflow:hidden;background:#f3f3f3}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.p-bottom img{object-position:center bottom}
.p-70 img{object-position:center 70%}
.p-62 img{object-position:center 62%}
.p-55 img{object-position:center 55%}
.tall{aspect-ratio:16/11}
</style></head><body>
<div class="row">
  <div class="c"><div class="lab">bottom</div><div class="ph p-bottom"><img src="/assets/hover-jilguero.webp"></div></div>
  <div class="c"><div class="lab">70%</div><div class="ph p-70"><img src="/assets/hover-jilguero.webp"></div></div>
  <div class="c"><div class="lab">62%</div><div class="ph p-62"><img src="/assets/hover-jilguero.webp"></div></div>
  <div class="c"><div class="lab">55%</div><div class="ph p-55"><img src="/assets/hover-jilguero.webp"></div></div>
</div>
<div class="row">
  <div class="c"><div class="lab">tall 16/11 · 62%</div><div class="ph tall p-62"><img src="/assets/hover-jilguero.webp"></div></div>
  <div class="c"><div class="lab">tall 16/11 · 70%</div><div class="ph tall p-70"><img src="/assets/hover-jilguero.webp"></div></div>
  <div class="c"><div class="lab">cuco 62%</div><div class="ph p-62"><img src="/assets/hover-cuco.webp"></div></div>
  <div class="c"><div class="lab">flamenco 62%</div><div class="ph p-62"><img src="/assets/hover-flamenco.webp"></div></div>
</div>
</body></html>
